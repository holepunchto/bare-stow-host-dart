name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pub-dev
    name: Publish
    steps:
      - uses: holepunchto/actions/dart-base@v1
      - uses: holepunchto/actions/publish-pub-dev@v1
